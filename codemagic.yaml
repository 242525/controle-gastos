workflows:
  app_build:
    name: Android APK Build
    instance_type: mac_mini_m1
    max_build_duration: 15
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - path: build/app/outputs/flutter-apk/app-release.apk
