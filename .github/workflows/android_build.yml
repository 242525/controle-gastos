name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'
    
    - name: Limpar projeto  # <-- ADICIONE ESTA PARTE
      run: |
        flutter clean
        cd android
        ./gradlew clean
        cd ..
    
    - name: Baixar dependências  # <-- ADICIONE ESTA PARTE
      run: flutter pub get
    
    - name: Build APK  # <-- ADICIONE ESTA PARTE
      run: flutter build apk --release
