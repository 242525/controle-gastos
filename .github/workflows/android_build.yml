name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4  # Também atualize para v4 se possível
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'
    
    - name: Setup Java
      uses: actions/setup-java@v4  # Atualize para v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Gerar arquivos Android
      run: |
        flutter create --platforms=android .
    
    - name: Limpar projeto
      run: flutter clean
    
    - name: Instalar dependências
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --release
    
    - name: Upload APK
      uses: actions/upload-artifact@v4  # VERSÃO CORRETA (v4)
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        if-no-files-found: error  # Opcional: falha se não encontrar o APK
